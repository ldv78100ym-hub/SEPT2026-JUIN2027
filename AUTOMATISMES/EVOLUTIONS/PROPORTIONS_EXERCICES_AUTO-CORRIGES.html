        // ============================================================
        //  GÉNÉRATEUR D'EXERCICES
        // ============================================================

        // Retourne un entier aléatoire entre min et max (inclus)
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Retourne un nombre aléatoire avec une décimale entre min et max
        function randDec(min, max, step = 0.05) {
            const n = Math.floor(Math.random() * ((max - min) / step + 1));
            return Math.round((min + n * step) * 100) / 100;
        }

        // Fractions "élégantes" pour proportions
        const FRACTIONS = [
            { num: 1, den: 2, p: 0.5 },
            { num: 1, den: 3, p: 1 / 3 },
            { num: 2, den: 3, p: 2 / 3 },
            { num: 1, den: 4, p: 0.25 },
            { num: 3, den: 4, p: 0.75 },
            { num: 1, den: 5, p: 0.2 },
            { num: 2, den: 5, p: 0.4 },
            { num: 3, den: 5, p: 0.6 },
            { num: 4, den: 5, p: 0.8 },
            { num: 1, den: 6, p: 1 / 6 },
            { num: 5, den: 6, p: 5 / 6 },
            { num: 1, den: 8, p: 0.125 },
            { num: 3, den: 8, p: 0.375 },
            { num: 5, den: 8, p: 0.625 },
            { num: 7, den: 8, p: 0.875 },
            { num: 1, den: 10, p: 0.1 },
            { num: 3, den: 10, p: 0.3 },
            { num: 7, den: 10, p: 0.7 },
            { num: 9, den: 10, p: 0.9 },
        ];

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                [a, b] = [b, a % b];
            }
            return a;
        }

        function fractionStr(num, den) {
            if (num === 0) return '0';
            if (num === den) return '1';
            const g = gcd(Math.abs(num), Math.abs(den));
            const n = num / g,
                d = den / g;
            if (d === 1) return `${n}`;
            return `${n}/${d}`;
        }

        function proportionStr(p, format) {
            if (format === 'fraction') {
                // Trouver la fraction la plus proche
                let best = { num: Math.round(p * 100), den: 100, diff: Infinity };
                for (const f of FRACTIONS) {
                    const diff = Math.abs(f.p - p);
                    if (diff < best.diff) {
                        best.diff = diff;
                        best.num = f.num;
                        best.den = f.den;
                    }
                }
                if (best.diff < 0.01) {
                    return `\\dfrac{${best.num}}{${best.den}}`;
                }
                // sinon fraction approximative
                const d = 100;
                const n = Math.round(p * d);
                const g = gcd(Math.abs(n), d);
                return `\\dfrac{${n/g}}{${d/g}}`;
            } else if (format === 'decimal') {
                return (Math.round(p * 1000) / 1000).toString();
            } else { // pourcentage
                return (Math.round(p * 1000) / 10).toString() + '\\%';
            }
        }

        // Structure d'un exercice
        function generateExercise() {
            const scenario = pickRandom(SCENARIOS);

            // Choix du total (entre 60 et 480, pour que les parts soient "belles")
            let total = randInt(60, 480);
            // Ajuster pour avoir des divisions propres
            const divisors = [2, 3, 4, 5, 6, 8, 10, 12, 15, 16, 20, 24, 30, 40, 48, 60, 80, 120];
            const d = pickRandom(divisors);
            total = Math.round(total / d) * d;
            if (total < 30) total += d;
            if (total > 500) total = 480;

            // Choisir une fraction pour p1
            const f1 = pickRandom(FRACTIONS);
            const p1 = f1.p;
            const part1 = Math.round(total * p1);
            // Ajuster pour que part1 soit entier et cohérent
            // (on ajuste total si besoin, mais on garde total proche)
            // On va plutôt ajuster part1

            // Choisir une fraction pour p2 (proportion de proportion)
            const f2 = pickRandom(FRACTIONS.filter(f => f.p > 0.05 && f.p < 0.95));
            const p2 = f2.p;
            const part2 = Math.round(part1 * p2);
            const overallProp = p1 * p2;

            // S'assurer que part2 > 0 et < part1
            if (part2 === 0 || part2 === part1) {
                // Refaire p2
                const f2b = pickRandom(FRACTIONS.filter(f => f.p > 0.1 && f.p < 0.9 && f.p !== p2));
                const p2b = f2b.p;
                const part2b = Math.round(part1 * p2b);
                if (part2b > 0 && part2b < part1) {
                    return generateExercise(); // simple récursion pour simplifier
                }
            }

            // Sélection du type de question (pondéré)
            const qTypes = [
                QTYPE.FIND_PROP,
                QTYPE.FIND_PART,
                QTYPE.FIND_TOTAL,
                QTYPE.FIND_PROP_OF_PROP,
                QTYPE.FIND_PART_OF_PROP,
                QTYPE.FIND_SECOND_PROP,
                QTYPE.FIND_FIRST_PART,
                QTYPE.FIND_OVERALL_PROP,
            ];
            let qType = pickRandom(qTypes);

            // Éviter les questions trop faciles ou redondantes
            // On peut forcer un type si les valeurs sont trop extrêmes

            const data = {
                scenario,
                total,
                p1,
                part1,
                p2,
                part2,
                overallProp,
                qType,
                f1,
                f2,
                // formats de réponse possibles
                formats: ['fraction', 'decimal', 'pourcentage'],
            };

            // Construire la question et la correction
            const result = buildQuestion(data);
            data.question = result.question;
            data.answer = result.answer;
            data.correction = result.correction;
            data.answerFormat = result.answerFormat || 'fraction';
            data.displayFormat = result.displayFormat || 'fraction';

            return data;
        }

        function buildQuestion(data) {
            const { scenario, total, p1, part1, p2, part2, overallProp, f1, f2, qType } = data;
            const ctx = scenario.contexte;
            const totalLabel = scenario.totalLabel;
            const partLabel = scenario.partLabel;
            const cat1 = scenario.cat1;
            const cat2 = scenario.cat2;
            const domaine = scenario.domaine;

            const p1Str = `\\dfrac{${f1.num}}{${f1.den}}`;
            const p2Str = `\\dfrac{${f2.num}}{${f2.den}}`;
            const p1Pct = Math.round(f1.p * 100);
            const p2Pct = Math.round(f2.p * 100);
            const overallPct = Math.round(overallProp * 1000) / 10;

            // Choisir un format de réponse aléatoire
            const formats = ['fraction', 'decimal', 'pourcentage'];
            const ansFormat = pickRandom(formats);

            let question = '';
            let answer = '';
            let correction = '';
            let displayFormat = 'fraction';

            // Remplacer les variables dans les textes
            const fmt = (str) => str;

            switch (qType) {
                case QTYPE.FIND_PROP:
                    // Trouver la proportion de part1 dans total
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, sur un total de <strong>${total}</strong> ${totalLabel} en ${ctx}, on compte <strong>${part1}</strong> ${partLabel}.<br><br>`;
                    question += `❓ <strong>Question :</strong> Quelle est la proportion de ${partLabel} parmi l'ensemble des ${totalLabel} ?<br>`;
                    question += `<span class="answer-format-hint">Donnez la réponse en <strong>${ansFormat === 'fraction' ? 'fraction irréductible' : ansFormat === 'decimal' ? 'nombre décimal' : 'pourcentage'}</strong>.</span>`;

                    const propVal = part1 / total;
                    const frac = fractionStr(part1, total);
                    if (ansFormat === 'fraction') {
                        answer = `\\dfrac{${frac.split('/')[0]}}{${frac.split('/')[1] || 1}}`;
                        displayFormat = 'fraction';
                    } else if (ansFormat === 'decimal') {
                        answer = (Math.round(propVal * 1000) / 1000).toString();
                        displayFormat = 'decimal';
                    } else {
                        answer = (Math.round(propVal * 1000) / 10).toString() + '\\%';
                        displayFormat = 'pourcentage';
                    }

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> La proportion d'une partie par rapport à un total est donnée par :</div>
                <div class="formula-box">$$ \\text{Proportion} = \\dfrac{\\text{Partie}}{\\text{Total}} $$</div>
                <div class="step">Application :</div>
                <div class="formula-box">$$ \\text{Proportion} = \\dfrac{${part1}}{${total}} = \\dfrac{${frac.split('/')[0]}}{${frac.split('/')[1] || 1}} $$</div>
                <div class="step">En <strong>fraction irréductible</strong> : $\\dfrac{${frac.split('/')[0]}}{${frac.split('/')[1] || 1}}$</div>
                <div class="step">En <strong>nombre décimal</strong> : $${(Math.round(propVal*1000)/1000).toFixed(3)}$</div>
                <div class="step">En <strong>pourcentage</strong> : $${(Math.round(propVal*1000)/10).toFixed(1)}\\%$</div>
                <div class="final-answer">✅ Réponse : $${ansFormat === 'fraction' ? '\\dfrac{'+frac.split('/')[0]+'}{'+ (frac.split('/')[1]||1)+'}' : ansFormat === 'decimal' ? (Math.round(propVal*1000)/1000).toFixed(3) : (Math.round(propVal*1000)/10).toFixed(1)+'\\%'}$</div>
                <div class="reminder"><strong>💡 À retenir :</strong> Une proportion s'exprime toujours comme un rapport entre une partie et un tout. Elle peut être présentée sous forme de fraction, de nombre décimal ou de pourcentage.</div>
              `;
                    break;

                case QTYPE.FIND_PART:
                    // Trouver part1 sachant total et p1
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, on sait que <strong>${p1Pct}%</strong> des ${totalLabel} en ${ctx} sont ${partLabel}. Le nombre total de ${totalLabel} est <strong>${total}</strong>.<br><br>`;
                    question += `❓ <strong>Question :</strong> Combien y a-t-il de ${partLabel} ?<br>`;
                    question += `<span class="answer-format-hint">Donnez un nombre entier.</span>`;

                    answer = part1.toString();
                    displayFormat = 'integer';

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> Pour calculer une partie à partir d'un total et d'une proportion :</div>
                <div class="formula-box">$$ \\text{Partie} = \\text{Total} \\times \\text{Proportion} $$</div>
                <div class="step">Ici, la proportion est $${p1Pct}\\% = \\dfrac{${f1.num}}{${f1.den}}$.</div>
                <div class="step">Application :</div>
                <div class="formula-box">$$ \\text{Partie} = ${total} \\times \\dfrac{${f1.num}}{${f1.den}} = ${part1} $$</div>
                <div class="final-answer">✅ Réponse : Il y a <strong>${part1}</strong> ${partLabel}.</div>
                <div class="reminder"><strong>💡 À retenir :</strong> Pour trouver une partie à partir d'un pourcentage, on multiplie le total par le pourcentage (en fraction ou en décimal).</div>
              `;
                    break;

                case QTYPE.FIND_TOTAL:
                    // Trouver total sachant part1 et p1
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, on sait que <strong>${part1}</strong> ${partLabel} représentent <strong>${p1Pct}%</strong> de l'ensemble des ${totalLabel} en ${ctx}.<br><br>`;
                    question += `❓ <strong>Question :</strong> Quel est le nombre total de ${totalLabel} ?<br>`;
                    question += `<span class="answer-format-hint">Donnez un nombre entier.</span>`;

                    answer = total.toString();
                    displayFormat = 'integer';

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> Pour trouver le total à partir d'une partie et de sa proportion :</div>
                <div class="formula-box">$$ \\text{Total} = \\dfrac{\\text{Partie}}{\\text{Proportion}} $$</div>
                <div class="step">La proportion est $${p1Pct}\\% = \\dfrac{${f1.num}}{${f1.den}}$.</div>
                <div class="step">Application :</div>
                <div class="formula-box">$$ \\text{Total} = \\dfrac{${part1}}{\\dfrac{${f1.num}}{${f1.den}}} = ${part1} \\times \\dfrac{${f1.den}}{${f1.num}} = ${total} $$</div>
                <div class="final-answer">✅ Réponse : Le nombre total de ${totalLabel} est <strong>${total}</strong>.</div>
                <div class="reminder"><strong>💡 À retenir :</strong> Connaître une partie et sa proportion permet de retrouver le total par une division.</div>
              `;
                    break;

                case QTYPE.FIND_PROP_OF_PROP:
                    // Proportion de la proportion : p1 * p2
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, sur <strong>${total}</strong> ${totalLabel} en ${ctx}, <strong>${p1Pct}%</strong> sont ${partLabel}. Parmi ces ${partLabel}, <strong>${p2Pct}%</strong> possèdent une caractéristique particulière.<br><br>`;
                    question += `❓ <strong>Question :</strong> Quelle est la proportion de ${totalLabel} qui possèdent cette caractéristique parmi l'ensemble des ${totalLabel} ?<br>`;
                    question += `<span class="answer-format-hint">Donnez la réponse en <strong>${ansFormat === 'fraction' ? 'fraction irréductible' : ansFormat === 'decimal' ? 'nombre décimal' : 'pourcentage'}</strong>.</span>`;

                    const overallFrac = fractionStr(Math.round(overallProp * 1000), 1000);
                    if (ansFormat === 'fraction') {
                        // Simplifier
                        const n = Math.round(overallProp * 1000);
                        const d = 1000;
                        const g = gcd(n, d);
                        answer = `\\dfrac{${n/g}}{${d/g}}`;
                        displayFormat = 'fraction';
                    } else if (ansFormat === 'decimal') {
                        answer = (Math.round(overallProp * 1000) / 1000).toString();
                        displayFormat = 'decimal';
                    } else {
                        answer = (Math.round(overallProp * 1000) / 10).toString() + '\\%';
                        displayFormat = 'pourcentage';
                    }

                    const p1num = f1.num,
                        p1den = f1.den;
                    const p2num = f2.num,
                        p2den = f2.den;
                    const prodNum = p1num * p2num;
                    const prodDen = p1den * p2den;
                    const gProd = gcd(prodNum, prodDen);
                    const simpNum = prodNum / gProd;
                    const simpDen = prodDen / gProd;

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> La proportion d'une sous-population (caractéristique) au sein de la population totale est le produit des proportions successives.</div>
                <div class="formula-box">$$ \\text{Proportion totale} = p_1 \\times p_2 $$</div>
                <div class="step">Ici, $p_1 = ${p1Pct}\\% = \\dfrac{${p1num}}{${p1den}}$ et $p_2 = ${p2Pct}\\% = \\dfrac{${p2num}}{${p2den}}$.</div>
                <div class="step">Application :</div>
                <div class="formula-box">$$ \\text{Proportion} = \\dfrac{${p1num}}{${p1den}} \\times \\dfrac{${p2num}}{${p2den}} = \\dfrac{${prodNum}}{${prodDen}} = \\dfrac{${simpNum}}{${simpDen}} $$</div>
                <div class="step">En <strong>nombre décimal</strong> : $${(Math.round(overallProp*1000)/1000).toFixed(3)}$</div>
                <div class="step">En <strong>pourcentage</strong> : $${(Math.round(overallProp*1000)/10).toFixed(1)}\\%$</div>
                <div class="final-answer">✅ Réponse : $${ansFormat === 'fraction' ? '\\dfrac{'+simpNum+'}{'+simpDen+'}' : ansFormat === 'decimal' ? (Math.round(overallProp*1000)/1000).toFixed(3) : (Math.round(overallProp*1000)/10).toFixed(1)+'\\%'}$</div>
                <div class="reminder"><strong>💡 À retenir :</strong> Lorsqu'on applique deux proportions successives, on les multiplie. C'est la règle des « proportions de proportions ».</div>
              `;
                    break;

                case QTYPE.FIND_PART_OF_PROP:
                    // Nombre de la sous-population (part2)
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, sur <strong>${total}</strong> ${totalLabel} en ${ctx}, <strong>${p1Pct}%</strong> sont ${partLabel}. Parmi ces ${partLabel}, <strong>${p2Pct}%</strong> possèdent une caractéristique particulière.<br><br>`;
                    question += `❓ <strong>Question :</strong> Combien de ${totalLabel} possèdent cette caractéristique ?<br>`;
                    question += `<span class="answer-format-hint">Donnez un nombre entier.</span>`;

                    answer = part2.toString();
                    displayFormat = 'integer';

                    const p1num2 = f1.num,
                        p1den2 = f1.den;
                    const p2num2 = f2.num,
                        p2den2 = f2.den;
                    const prodNum2 = p1num2 * p2num2;
                    const prodDen2 = p1den2 * p2den2;

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> Pour trouver l'effectif d'une sous-population, on multiplie le total par la première proportion, puis par la seconde.</div>
                <div class="formula-box">$$ \\text{Effectif} = \\text{Total} \\times p_1 \\times p_2 $$</div>
                <div class="step">Ici, $p_1 = \\dfrac{${p1num2}}{${p1den2}}$, $p_2 = \\dfrac{${p2num2}}{${p2den2}}$.</div>
                <div class="step">Application :</div>
                <div class="formula-box">$$ \\text{Effectif} = ${total} \\times \\dfrac{${p1num2}}{${p1den2}} \\times \\dfrac{${p2num2}}{${p2den2}} = ${part2} $$</div>
                <div class="step">On peut aussi calculer d'abord le nombre de ${partLabel} : $${total} \\times \\dfrac{${p1num2}}{${p1den2}} = ${part1}$, puis $${part1} \\times \\dfrac{${p2num2}}{${p2den2}} = ${part2}$.</div>
                <div class="final-answer">✅ Réponse : Il y a <strong>${part2}</strong> ${totalLabel} possédant la caractéristique.</div>
                <div class="reminder"><strong>💡 À retenir :</strong> Une proportion de proportion s'applique en cascade : on multiplie le total par chaque proportion successive.</div>
              `;
                    break;

                case QTYPE.FIND_SECOND_PROP:
                    // Trouver p2 sachant total, p1, part2
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, sur <strong>${total}</strong> ${totalLabel} en ${ctx}, <strong>${p1Pct}%</strong> sont ${partLabel}. Parmi ces ${partLabel}, on sait que <strong>${part2}</strong> possèdent une caractéristique particulière.<br><br>`;
                    question += `❓ <strong>Question :</strong> Quelle est la proportion de ${partLabel} qui possèdent cette caractéristique ?<br>`;
                    question += `<span class="answer-format-hint">Donnez la réponse en <strong>${ansFormat === 'fraction' ? 'fraction irréductible' : ansFormat === 'decimal' ? 'nombre décimal' : 'pourcentage'}</strong>.</span>`;

                    const p2val = part2 / part1;
                    const frac2 = fractionStr(part2, part1);
                    if (ansFormat === 'fraction') {
                        const parts = frac2.split('/');
                        answer = `\\dfrac{${parts[0]}}{${parts[1] || 1}}`;
                        displayFormat = 'fraction';
                    } else if (ansFormat === 'decimal') {
                        answer = (Math.round(p2val * 1000) / 1000).toString();
                        displayFormat = 'decimal';
                    } else {
                        answer = (Math.round(p2val * 1000) / 10).toString() + '\\%';
                        displayFormat = 'pourcentage';
                    }

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> Pour trouver une proportion à partir d'une partie et d'un sous-total :</div>
                <div class="formula-box">$$ \\text{Proportion} = \\dfrac{\\text{Partie}}{\\text{Sous-total}} $$</div>
                <div class="step">D'abord, on calcule le nombre de ${partLabel} : $${total} \\times \\dfrac{${f1.num}}{${f1.den}} = ${part1}$.</div>
                <div class="step">Ensuite, la proportion cherchée est :</div>
                <div class="formula-box">$$ \\dfrac{${part2}}{${part1}} = \\dfrac{${frac2.split('/')[0]}}{${frac2.split('/')[1] || 1}} $$</div>
                <div class="step">En <strong>nombre décimal</strong> : $${(Math.round(p2val*1000)/1000).toFixed(3)}$</div>
                <div class="step">En <strong>pourcentage</strong> : $${(Math.round(p2val*1000)/10).toFixed(1)}\\%$</div>
                <div class="final-answer">✅ Réponse : $${ansFormat === 'fraction' ? '\\dfrac{'+ (frac2.split('/')[0])+'}{'+ (frac2.split('/')[1]||1)+'}' : ansFormat === 'decimal' ? (Math.round(p2val*1000)/1000).toFixed(3) : (Math.round(p2val*1000)/10).toFixed(1)+'\\%'}$</div>
                <div class="reminder"><strong>💡 À retenir :</strong> On peut toujours exprimer une proportion comme le quotient d'une partie par le tout correspondant.</div>
              `;
                    break;

                case QTYPE.FIND_FIRST_PART:
                    // Trouver part1 sachant total, p2, part2
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, sur <strong>${total}</strong> ${totalLabel} en ${ctx}, on sait que parmi les ${partLabel}, <strong>${p2Pct}%</strong> possèdent une caractéristique particulière, ce qui correspond à <strong>${part2}</strong> ${totalLabel}.<br><br>`;
                    question += `❓ <strong>Question :</strong> Combien y a-t-il de ${partLabel} ?<br>`;
                    question += `<span class="answer-format-hint">Donnez un nombre entier.</span>`;

                    answer = part1.toString();
                    displayFormat = 'integer';

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> Pour retrouver un sous-total à partir d'une partie et d'une proportion :</div>
                <div class="formula-box">$$ \\text{Sous-total} = \\dfrac{\\text{Partie}}{\\text{Proportion}} $$</div>
                <div class="step">La proportion $p_2 = \\dfrac{${f2.num}}{${f2.den}}$.</div>
                <div class="step">Application :</div>
                <div class="formula-box">$$ \\text{Nombre de ${partLabel}} = \\dfrac{${part2}}{\\dfrac{${f2.num}}{${f2.den}}} = ${part2} \\times \\dfrac{${f2.den}}{${f2.num}} = ${part1} $$</div>
                <div class="final-answer">✅ Réponse : Il y a <strong>${part1}</strong> ${partLabel}.</div>
                <div class="reminder"><strong>💡 À retenir :</strong> Pour remonter d'une proportion à une population, on divise par la proportion.</div>
              `;
                    break;

                case QTYPE.FIND_OVERALL_PROP:
                    // Trouver la proportion globale (p1*p2) sans donner le total
                    question =
                        `Dans un contexte de <strong>${domaine}</strong>, on sait que <strong>${p1Pct}%</strong> des ${totalLabel} en ${ctx} sont ${partLabel}. Parmi ces ${partLabel}, <strong>${p2Pct}%</strong> possèdent une caractéristique particulière.<br><br>`;
                    question += `❓ <strong>Question :</strong> Quelle est la proportion de ${totalLabel} possédant cette caractéristique parmi l'ensemble des ${totalLabel} ?<br>`;
                    question += `<span class="answer-format-hint">Donnez la réponse en <strong>${ansFormat === 'fraction' ? 'fraction irréductible' : ansFormat === 'decimal' ? 'nombre décimal' : 'pourcentage'}</strong>.</span>`;

                    const overallFrac2 = fractionStr(Math.round(overallProp * 1000), 1000);
                    if (ansFormat === 'fraction') {
                        const n = Math.round(overallProp * 1000);
                        const d = 1000;
                        const g = gcd(n, d);
                        answer = `\\dfrac{${n/g}}{${d/g}}`;
                        displayFormat = 'fraction';
                    } else if (ansFormat === 'decimal') {
                        answer = (Math.round(overallProp * 1000) / 1000).toString();
                        displayFormat = 'decimal';
                    } else {
                        answer = (Math.round(overallProp * 1000) / 10).toString() + '\\%';
                        displayFormat = 'pourcentage';
                    }

                    const p1n = f1.num,
                        p1d = f1.den;
                    const p2n = f2.num,
                        p2d = f2.den;
                    const prodN = p1n * p2n;
                    const prodD = p1d * p2d;
                    const gP = gcd(prodN, prodD);

                    correction = `
                <div class="step"><strong>📌 Rappel :</strong> La proportion globale est le produit des deux proportions successives.</div>
                <div class="formula-box">$$ p_{\\text{globale}} = p_1 \\times p_2 $$</div>
                <div class="step">Ici, $p_1 = \\dfrac{${p1n}}{${p1d}}$ et $p_2 = \\dfrac{${p2n}}{${p2d}}$.</div>
                <div class="step">Application :</div>
                <div class="formula-box">$$ p_{\\text{globale}} = \\dfrac{${p1n}}{${p1d}} \\times \\dfrac{${p2n}}{${p2d}} = \\dfrac{${prodN}}{${prodD}} = \\dfrac{${prodN/gP}}{${prodD/gP}} $$</div>
                <div class="step">En <strong>nombre décimal</strong> : $${(Math.round(overallProp*1000)/1000).toFixed(3)}$</div>
                <div class="step">En <strong>pourcentage</strong> : $${(Math.round(overallProp*1000)/10).toFixed(1)}\\%$</div>
                <div class="final-answer">✅ Réponse : $${ansFormat === 'fraction' ? '\\dfrac{'+ (prodN/gP)+'}{'+ (prodD/gP)+'}' : ansFormat === 'decimal' ? (Math.round(overallProp*1000)/1000).toFixed(3) : (Math.round(overallProp*1000)/10).toFixed(1)+'\\%'}$</div>
                <div class="reminder"><strong>💡 À retenir :</strong> La proportion d'une sous-population dans la population totale est le produit des proportions successives. Le total n'est pas nécessaire si on ne demande que la proportion.</div>
              `;
                    break;

                default:
                    question = 'Erreur : type de question inconnu.';
                    answer = '';
                    correction = '';
            }

            // Nettoyer les doubles espaces et ajouter des sauts
            return {
                question: question,
                answer: answer,
                correction: correction,
                answerFormat: displayFormat,
                displayFormat: displayFormat,
            };
        }

        // ============================================================
        //  RENDU ET INTERACTION
        // ============================================================

        let currentExercise = null;
        let exerciseCounter = 0;
        let correctionVisible = false;

        function renderExercise(exercise) {
            const container = document.getElementById('exerciseContent');
            const badge = document.getElementById('badgeDomain');

            badge.textContent = exercise.scenario.domaine;

            // On n'affiche la question qu'une seule fois dans le question-block
            container.innerHTML = `
            <div class="question-block">
              <div class="question-label">📌 Énoncé </div>
              <div class="question-text">${exercise.question}</div>
              <div class="math-display" id="mathDisplay"></div>
            </div>
          `;

            // Réafficher MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch(() => {});
            }

            // Cacher la correction
            const corrArea = document.getElementById('correctionArea');
            corrArea.classList.remove('visible');
            correctionVisible = false;

            // Mettre à jour le compteur
            document.getElementById('exoCounter').textContent = `Exercice #${exerciseCounter}`;

            // Stocker l'exercice courant
            currentExercise = exercise;
        }

        function showCorrection() {
            if (!currentExercise) return;
            const area = document.getElementById('correctionArea');
            const body = document.getElementById('correctionBody');

            // Vérifier si la correction est déjà visible
            if (correctionVisible) {
                area.classList.remove('visible');
                correctionVisible = false;
                document.getElementById('btnShowCorrection').textContent = '📘 Voir la correction';
                return;
            }

            body.innerHTML = currentExercise.correction;

            area.classList.add('visible');
            correctionVisible = true;
            document.getElementById('btnShowCorrection').textContent = '📕 Masquer la correction';

            // Réafficher MathJax pour la correction
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch(() => {});
            }
        }

        function newExercise() {
            const ex = generateExercise();
            exerciseCounter++;
            renderExercise(ex);
            // Réinitialiser le bouton de correction
            document.getElementById('btnShowCorrection').textContent = '📘 Voir la correction';
            correctionVisible = false;
            document.getElementById('correctionArea').classList.remove('visible');

            // Scroll en haut
            document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============================================================
        //  INITIALISATION
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnShowCorrection').addEventListener('click', showCorrection);
            document.getElementById('btnNewExercise').addEventListener('click', newExercise);

            // Premier exercice
            newExercise();
        });

        // Pour rattraper les éventuels problèmes de MathJax après le premier rendu
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise().catch(() => {});
                }
            }, 300);
        });

        // Gestion du redimensionnement pour les équations
        window.addEventListener('resize', () => {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch(() => {});
            }
        });
    </script>
