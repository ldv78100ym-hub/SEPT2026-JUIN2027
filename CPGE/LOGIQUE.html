.pgbox svg{display:block;width:100%;height:auto}
.pg-node{opacity:0;transform-box:fill-box;transform-origin:center}
.pg-edge path{stroke-dasharray:1;stroke-dashoffset:1}
.pg-head{opacity:0}
.pg-fade{opacity:0}
.pg-target-ring{opacity:0;transform-box:fill-box;transform-origin:center}
.play .pg-node{animation:pgpop .4s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:var(--d)}
.play .pg-edge path{animation:pgdraw .45s ease-out forwards;animation-delay:var(--d)}
.play .pg-head{animation:pgfade .3s ease-out forwards;animation-delay:calc(var(--d) + .38s)}
.play .pg-fade{animation:pgfade .35s ease-out forwards;animation-delay:calc(var(--d) + .15s)}
.play .pg-target-ring{animation:pgpulse 1.7s ease-in-out infinite;animation-delay:calc(var(--d) + .55s)}
@keyframes pgdraw{to{stroke-dashoffset:0}}
@keyframes pgfade{to{opacity:1}}
@keyframes pgpop{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
@keyframes pgpulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
.pg-empty{padding:26px 14px;text-align:center;font-size:12px;line-height:1.7;color:#7488a3}
.pglegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 0;font-size:11px;color:#5a6b85}
.pglegend .pgkey{display:inline-flex;align-items:center;gap:6px}
.pglegend .pgdot{width:10px;height:10px;border-radius:999px;display:inline-block;border:1px solid rgba(31,58,110,.15)}
.wchart{margin-top:10px;border:1px solid rgba(31,58,110,.15);background:rgba(255,255,255,.7);border-radius:14px;padding:14px}
.wbar{display:flex;height:24px;border-radius:8px;overflow:hidden;border:1px solid rgba(31,58,110,.15);background:#eaf1f9}
.wseg{position:relative;overflow:hidden;min-width:0}
.wseg .fill{position:absolute;inset:0;transform:scaleX(0);transform-origin:left}
.wseg.v .fill{background:linear-gradient(90deg,#5fd3a5,#0f9d6e)}
.wseg.f .fill{background:linear-gradient(90deg,#fb8aa4,#d6405f)}
.play .wseg .fill{animation:pggrow .9s ease-out forwards;animation-delay:var(--d)}
@keyframes pggrow{to{transform:scaleX(1)}}
.wlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:11px;line-height:1.6;color:#5a6b85}
.wdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@keyframes lpshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:lpshake .35s ease}
@media(prefers-reduced-motion:reduce){
  .shake{animation:none}
  .play .pg-node,.play .pg-head,.play .pg-fade,.play .pg-target-ring,.play .pg-edge path,.play .wseg .fill{animation:none}
  .play .pg-node,.play .pg-head,.play .pg-fade{opacity:1}
  .play .pg-target-ring{opacity:.5}
  .play .pg-edge path{stroke-dashoffset:0}
  .play .wseg .fill{transform:none}
}

<body>
<div id="app"><div class="wrap" style="padding-top:80px;text-align:center;color:#64748b">Chargement de Logique Pure…</div></div>
<div id="modals"></div>
<noscript><p style="text-align:center;padding:40px;color:#be2a55">Cette application nécessite JavaScript.</p></noscript>
<script>
/* ================================================================
   MOTEUR — logique propositionnelle sur littéraux (P, ¬P).
   Énoncés : affirmations (P), implications (P → Q), équivalences (P ⇔ Q).
   Verdict sémantique : énumération des mondes compatibles.
   Chaîne : chaînage avant modus ponens / biconditionnel.
   ================================================================ */

const isNeg = (l) => l.startsWith("!");
const atomOf = (l) => (isNeg(l) ? l.slice(1) : l);

function evalLit(l, asg) {
  const v = asg[atomOf(l)] === undefined ? false : asg[atomOf(l)];
  return isNeg(l) ? !v : v;
}
function holds(p, asg) {
  if (p.kind === "aff") return evalLit(p.a, asg);
  if (p.kind === "imp") return !evalLit(p.a, asg) || evalLit(p.b, asg);
  return evalLit(p.a, asg) === evalLit(p.b, asg);
}
function verdictOf(pz) {
  const atoms = Object.keys(pz.atoms);
  let total = 0;
  let t = 0;
  for (let mask = 0; mask < 1 << atoms.length; mask++) {
    const asg = {};
    atoms.forEach((a, i) => (asg[a] = !!(mask & (1 << i))));
    if (pz.premises.every((p) => holds(p, asg))) {
      total++;
      if (asg[pz.target]) t++;
    }
  }
  if (total === 0) return { verdict: "indetermine", total, t };
  if (t === total) return { verdict: "vrai", total, t };
  if (t === 0) return { verdict: "faux", total, t };
  return { verdict: "indetermine", total, t };
}

const ALREADY = "@@known";
function applyPremise(p, known) {
  if (p.kind === "aff") return known.has(p.a) ? null : p.a;
  if (p.kind === "imp") {
    if (!known.has(p.a)) return null;
    return known.has(p.b) ? ALREADY : p.b;
  }
  if (known.has(p.a) && !known.has(p.b)) return p.b;
  if (known.has(p.b) && !known.has(p.a)) return p.a;
  return known.has(p.a) ? ALREADY : null;
}
function closureChain(premises) {
  const known = new Set();
  const chain = [];
  const used = new Set();
  let progress = true;
  while (progress) {
    progress = false;
    for (const p of premises) {
      if (used.has(p.id)) continue;
      const r = applyPremise(p, known);
      if (r && r !== ALREADY) {
        used.add(p.id);
        known.add(r);
        chain.push({ p, d: r });
        progress = true;
      }
    }
  }
  return chain;
}
function minChain(premises, target) {
  const goals = [target, "!" + target];
  const key = (known, used) =>
    [...known].sort().join(",") + "|" + [...used].sort().join(",");
  const emptyK = new Set();
  const emptyU = new Set();
  const queue = [{ known: emptyK, used: emptyU, chain: [] }];
  const seen = new Set([key(emptyK, emptyU)]);
  while (queue.length) {
    const s = queue.shift();
    for (const p of premises) {
      if (s.used.has(p.id)) continue;
      const r = applyPremise(p, s.known);
      if (!r || r === ALREADY) continue;
      const nk = new Set(s.known);
      nk.add(r);
      const nu = new Set(s.used);
      nu.add(p.id);
      const chain = [...s.chain, { p, d: r }];
      if (goals.includes(r)) return chain;
      const k = key(nk, nu);
      if (!seen.has(k)) {
        seen.add(k);
        queue.push({ known: nk, used: nu, chain });
      }
    }
  }
  return null;
}

function litSym(l, pz) {
  const d = pz.atoms[atomOf(l)];
  return isNeg(l) ? "¬" + d.sym : d.sym;
}
function litText(l, pz) {
  const d = pz.atoms[atomOf(l)];
  return isNeg(l) ? (d.negText || "non : " + d.text) : d.text;
}
function computeInfo(pz) {
  const sem = verdictOf(pz);
  const canonical =
    sem.verdict === "indetermine"
      ? closureChain(pz.premises)
      : minChain(pz.premises, pz.target) || closureChain(pz.premises);
  return {
    verdict: sem.verdict,
    models: sem.total,
    tTrue: sem.t,
    optimal: canonical.length,
    canonical,
  };
}

/* ---- Construction des enquêtes depuis les données brutes ---- */
function buildPuzzle(r) {
  const atoms = {};
  for (const k of Object.keys(r.atoms)) {
    const v = r.atoms[k];
    atoms[k] = { sym: v[0], text: v[1], negText: v[2] };
  }
  return {
    id: r.id,
    title: r.title,
    story: r.story,
    diff: r.diff,
    atoms,
    premises: r.prem.map((p, i) => ({
      id: "p" + (i + 1),
      kind: p[0],
      a: p[1],
      b: p[2] === "" ? undefined : p[2],
      text: p[3],
    })),
    target: r.target,
    moral: r.moral,
    source: r.source,
  };
}

/* ================================================================
   FOUILLE — moteur de découverte automatique d'énigmes
   Fouille le Web (Wikisource, textes du domaine public, API CORS),
   en extrait des raisonnements universels, les convertit en enquêtes,
   les valide avec le moteur de logique et les enregistre sans
   intervention humaine. Un générateur local (formes classiques)
   complète quand le Web reste muet.
   ================================================================ */

const MINED_KEY = STORE_KEY + ".fouille.v1";
const MINED_CAP = 40;

function loadMined() {
  try {
    const raw = localStorage.getItem(MINED_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.items)) return { items: p.items, lastRun: p.lastRun === undefined ? null : p.lastRun };
    }
  } catch (e) {
    /* stockage indisponible */
  }
  return { items: [], lastRun: null };
}
function persistMined(store) {
  try {
    localStorage.setItem(MINED_KEY, JSON.stringify(store));
  } catch (e) {
    /* stockage indisponible */
  }
}

function puzzleFingerprint(r) {
  return r.prem
    .map((p) => p[3])
    .join("§")
    .toLowerCase()
    .replace(/\s+/g, " ");
}
function capFirst(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

async function fetchWikisourceText(page) {
  const url =
    "https://fr.wikisource.org/w/api.php?action=parse&page=" +
    encodeURIComponent(page) +
    "&prop=wikitext&format=json&origin=*";
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const wt = data && data.parse ? data.parse.wikitext : undefined;
  return typeof wt === "string" ? wt : wt && wt["*"] ? wt["*"] : "";
}

/* ---- Extraction d'énoncés universels dans un texte libre ---- */
function normPhrase(s) {
  return s
    .toLowerCase()
    .replace(/^(?:les |la |le |l'|une? |des |du |de la |d')/, "")
    .replace(/\s+/g, " ")
    .trim();
}
function mineSentences(text) {
  const clean = text
    .replace(/\{\{[^}]*\}\}/g, " ")
    .replace(/\[\[[^\]|]*\|/g, "")
    .replace(/\[\[|\]\]/g, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/\s+/g, " ");
  const edges = [];
  const facts = [];
  const reU =
    /\b(?:Tous|Toutes|Tout|Toute|Nul|Nulle|Aucun|Aucune)\s+(?:les\s+|la\s+|le\s+|l'|une?\s+)?([A-Za-zÀ-ÿ' -]{2,40}?)\s+(?:ne\s+peuvent?\s+pas\s+être|ne\s+peut\s+pas\s+être|ne\s+sont\s+pas|n'est\s+pas|ne\s+sont|sont|est|peuvent\s+être|peut\s+être)\s+(?:pas\s+)?(?:des\s+|une?\s+|le\s+|la\s+|les\s+|l')?([A-Za-zÀ-ÿ' -]{2,40}?)(?=[,.;:!?])/g;
  const reS =
    /\b([A-ZÀ-Þ][a-zàâäéèêëïîôöùûüç']{1,15}(?:\s[A-ZÀ-Þ][a-zàâäéèêëïîôöùûüç']{1,15})?)\s+(?:n'est\s+pas|est)\s+(?:pas\s+)?(?:un\s+|une?\s+|le\s+|la\s+|les\s+|l')?([a-zàâäéèêëïîôöùûüç' -]{2,40}?)(?=[,.;:!?])/g;
  let m;
  while ((m = reU.exec(clean))) {
    const q = m[0];
    const neg = /(?:n'est\s+pas|ne\s+sont\s+pas|ne\s+peuvent?\s+pas|Aucun|Aucune|Nul|Nulle)/.test(q);
    const x = normPhrase(m[1]);
    const y = normPhrase(m[2]);
    if (!x || !y || MINE_STOP.has(x) || x.length < 3 || y.length < 3 || x === y) continue;
    edges.push({ x, y, neg, text: capFirst(q.replace(/\s+/g, " ").trim()) + "." });
  }
  while ((m = reS.exec(clean))) {
    const subj = m[1].trim();
    const neg = m[0].includes("n'est pas");
    const pred = normPhrase(m[2]);
    if (!pred || pred.length < 3 || subj.length > 24 || MINE_STOP.has(subj.toLowerCase())) continue;
    facts.push({ subj, pred, text: subj + (neg ? " n'est pas " : " est ") + m[2].trim() + "." });
  }
  return { edges, facts };
}

/* ---- Composition d'une enquête depuis les phrases extraites ---- */
function composeFromMine(srcLabel, srcAuthor, srcWork, srcYear, srcUrl, edges, facts, taken) {
  const byX = new Map();
  for (const e of edges) {
    const arr = byX.get(e.x) || [];
    arr.push(e);
    byX.set(e.x, arr);
  }
  const distractors = edges.filter((e) => e.x.length > 3 && e.y.length > 3).slice(0, 30);
  for (const f of facts) {
    const level1 = (byX.get(f.pred) || []).filter((e) => !e.neg);
    for (const e1 of level1) {
      const level2 = byX.get(e1.y) || [];
      for (const e2 of level2) {
        if (e2.x === f.pred && e2.y === f.pred) continue;
        const atomText = (p) => capFirst(f.subj) + " est " + p;
        const negText = (p) => capFirst(f.subj) + " n'est pas " + p;
        const atoms = {
          A: ["A", atomText(f.pred), negText(f.pred)],
          B: ["B", atomText(e1.y), negText(e1.y)],
          C: ["C", atomText(e2.y), negText(e2.y)],
        };
        const prem = [
          ["aff", "A", "", capFirst(f.text)],
          ["imp", "A", "B", e1.text],
          ["imp", "B", e2.neg ? "!C" : "C", e2.text],
        ];
        // distracteurs pris dans le même texte (jamais établis par eux-mêmes)
        // (max 1 distracteur = 2 atomes de plus : 3 + 2 = 5 ≤ 6 ;
        //  variantes pluriel du cœur exclues pour éviter les doublons)
        const sing = (w) => w.replace(/s$/, "");
        const coreAtoms = [f.pred, e1.y, e2.y];
        const extras = distractors
          .filter(
            (d) =>
              d !== e1 &&
              d !== e2 &&
              d.x !== f.pred &&
              d.x !== e1.y &&
              !coreAtoms.some((c) => sing(c) === sing(d.x) || sing(c) === sing(d.y))
          )
          .slice(0, 1);
        let k = 0;
        for (const d of extras) {
          const ka = "X" + k;
          const kb = "X" + (k + 1);
          atoms[ka] = [ka, atomText(d.x), negText(d.x)];
          atoms[kb] = [kb, atomText(d.y), negText(d.y)];
          prem.push(["imp", ka, d.neg ? "!" + kb : kb, d.text]);
          k += 2;
        }
        // ordre mélangé
        for (let i = prem.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = prem[i];
          prem[i] = prem[j];
          prem[j] = tmp;
        }
        const fpCand = puzzleFingerprint({ prem });
        let hCand = 0;
        for (let i = 0; i < fpCand.length; i++) hCand = (hCand * 31 + fpCand.charCodeAt(i)) | 0;
        const cand = {
          id: "web_" + Math.abs(hCand).toString(36),
          title: "Découverte : " + capFirst(f.subj),
          story:
            "Énigme extraite automatiquement d'un texte libre de droits — les énoncés viennent de la source, la cible et l'ordre sont choisis par le moteur.",
          diff: 2,
          atoms: atoms,
          prem: prem,
          target: "C",
          moral:
            "Extraite automatiquement de " + srcWork + " — les phrases de la source deviennent les prémisses d'un syllogisme.",
          source: {
            author: srcAuthor,
            work: srcWork,
            family: "Fouille — Wikisource",
            year: srcYear,
            url: srcUrl,
            license: "Domaine public — texte via Wikisource",
            note: "Extraite automatiquement par le fouilleur",
          },
        };
        if (taken.has(puzzleFingerprint(cand))) continue;
        const pz = buildPuzzle(cand);
        const info = computeInfo(pz);
        const sem = info.verdict;
        const okSem = sem === "vrai" || sem === "faux";
        const okOpt = okSem && info.optimal >= 2 && info.optimal <= 4;
        const okAtoms = Object.keys(atoms).length <= 6;
        if (okSem && okOpt && okAtoms && info.models > 0) return cand;
      }
    }
  }
  return null;
}

/* ---- Générateur local : formes classiques × décors du quotidien ---- */
const GEN_SOURCE = (theme) => ({
  author: "Moteur de composition locale",
  work: "Formes classiques (Barbara, Celarent, tollens, équivalence) — « " + theme + " »",
  family: "Générateur",
  license: "Libre de droits — générée par l'application",
  note: "Composition originale générée et validée automatiquement",
});

function buildGenPuzzle(ci, form) {
  const ctx = GEN_CONTEXTS[ci];
  const A = (i) => [String.fromCharCode(65 + i), ctx.atoms[i][0], ctx.atoms[i][1]];
  let prem = [];
  let target = "D";
  let diff = 3;
  if (form === 0) {
    prem = [
      ["aff", "A", "", ctx.aff],
      ["imp", "A", "B", ctx.e01],
      ["imp", "B", "C", ctx.e12],
      ["imp", "C", "D", ctx.e23],
      ["imp", "B", "F", ctx.branch],
      ["imp", "E", "F", ctx.dead],
    ];
    target = "D";
    diff = 3;
  } else if (form === 1) {
    prem = [
      ["aff", "A", "", ctx.aff],
      ["imp", "A", "B", ctx.e01],
      ["imp", "B", "!D", ctx.neg13],
      ["imp", "B", "F", ctx.branch],
      ["imp", "E", "F", ctx.dead],
    ];
    target = "D";
    diff = 2;
  } else if (form === 2) {
    prem = [
      ["aff", "A", "", ctx.aff],
      ["imp", "A", "B", ctx.e01],
      ["imp", "B", "C", ctx.e12],
      ["imp", "F", "D", ctx.side],
      ["imp", "E", "F", ctx.dead],
    ];
    target = "F";
    diff = 2;
  } else {
    prem = [
      ["aff", "A", "", ctx.aff],
      ["eq", "A", "B", ctx.eq],
      ["imp", "B", "C", ctx.e12],
      ["imp", "E", "F", ctx.dead],
    ];
    target = "C";
    diff = 2;
  }
  for (let i = prem.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = prem[i];
    prem[i] = prem[j];
    prem[j] = tmp;
  }
  const atoms = {};
  for (let i = 0; i < 6; i++) atoms[String.fromCharCode(65 + i)] = A(i);
  return {
    id: "gen_" + ci + "_" + form,
    title: ctx.theme,
    story:
      "Syllogisme composé automatiquement par le moteur local : une forme classique (Barbara, Celarent, tollens ou équivalence) sur un décor du quotidien, validé par le même moteur que toutes les enquêtes.",
    diff: diff,
    atoms: atoms,
    prem: prem,
    target: target,
    moral:
      "Le syllogisme est une machine à varier à l'infini : changez le décor, la forme reste — et la nécessité avec elle.",
    source: GEN_SOURCE(ctx.theme),
  };
}
function generatePuzzles(n, taken) {
  const combos = [];
  for (let ci = 0; ci < GEN_CONTEXTS.length; ci++) for (let f = 0; f < 4; f++) combos.push({ ci: ci, form: f });
  for (let i = combos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = combos[i];
    combos[i] = combos[j];
    combos[j] = tmp;
  }
  const out = [];
  for (const c of combos) {
    if (out.length >= n) break;
    const cand = buildGenPuzzle(c.ci, c.form);
    const fp = puzzleFingerprint(cand);
    if (taken.has(fp)) continue;
    const info = computeInfo(buildPuzzle(cand));
    const okVerdict = info.verdict === "vrai" || info.verdict === "faux" || info.verdict === "indetermine";
    const okPlay = info.verdict === "indetermine" ? info.canonical.length >= 2 : info.optimal >= 2 && info.optimal <= 5;
    if (!okVerdict || !okPlay || info.models === 0) continue;
    taken.add(fp);
    out.push(cand);
  }
  return out;
}

/* ---- Orchestration : fouille Web puis générateur, enregistrement auto ---- */
let MINER_BUSY = false;
async function runMiner() {
  const store = loadMined();
  const log = [];
  if (MINER_BUSY) {
    log.push("Une fouille est déjà en cours — patience.");
    return { log, store };
  }
  MINER_BUSY = true;
  try {
    const now = Date.now();
    if (store.lastRun && now - store.lastRun < 30 * 60 * 1000) {
      log.push("Dernière fouille il y a moins de 30 minutes — rien à refaire.");
      return { log, store };
    }
    log.push("Fouille lancée — sources : Wikisource (textes du domaine public, licence ouverte).");
    const taken = new Set();
    PUZZLES.forEach((p) =>
      taken.add(
        p.premises
          .map((x) => x.text)
          .sort()
          .join("§")
          .toLowerCase()
      )
    );
    store.items.forEach((r) => taken.add(puzzleFingerprint(r)));
    const fresh = [];
    let webOk = 0;
    for (const src of WEB_SOURCES) {
      try {
        log.push("Interrogation : " + src.label + "…");
        const text = await fetchWikisourceText(src.page);
        const minedRes = mineSentences(text);
        log.push("  " + minedRes.edges.length + " énoncés universels, " + minedRes.facts.length + " faits singuliers extraits.");
        const url = "https://fr.wikisource.org/wiki/" + src.page;
        const cand = composeFromMine(src.label, src.author, src.work, src.year, url, minedRes.edges, minedRes.facts, taken);
        if (cand) {
          const info = computeInfo(buildPuzzle(cand));
          log.push("  énigme retenue : « " + cand.title + " » (" + info.verdict + ", chaîne exemplaire : " + info.optimal + " pas).");
          taken.add(puzzleFingerprint(cand));
          fresh.push(cand);
          webOk++;
        } else {
          log.push("  aucune chaîne valide cette fois.");
        }
        if (webOk >= 3) break;
      } catch (e) {
        log.push("  source injoignable (" + String(e && e.message ? e.message : e).slice(0, 50) + ").");
      }
    }
    log.push("Web : " + webOk + " découverte(s) validée(s), référencées et prêtes.");
    const quota = Math.max(0, 4 - fresh.length);
    const gen = generatePuzzles(quota, taken);
    gen.forEach((p) => fresh.push(p));
    log.push(
      gen.length
        ? "Générateur local : " + gen.length + " composition(s) originale(s) ajoutée(s) (formes classiques garanties valides)."
        : "Générateur local : aucune composition nouvelle à ajouter."
    );
    if (fresh.length) {
      store.items = [...fresh, ...store.items].slice(0, MINED_CAP);
      log.push("Enregistrement automatique : " + fresh.length + " nouvelle(s) énigme(s) sauvegardée(s).");
    } else {
      log.push("Rien de neuf à enregistrer — les découvertes déjà faites restent disponibles.");
    }
    store.lastRun = now;
    persistMined(store);
    log.push("Fouille terminée.");
  } finally {
    MINER_BUSY = false;
  }
  return { log, store };
}

function esc(s) {

/* ---- Écran : jeu ---- */
function startLevel(i) {
  state.level = i;
  state.game = {
    mode: "level",
    index: i,
    pz: PUZZLES[i],
    info: INFO[PUZZLES[i].id],
    chain: [],
    attempts: 0,
    wrong: null,
    err: null,
    result: null,
    label: "Niveau " + (i + 1) + " · " + DIFF_LABELS[PUZZLES[i].diff],
    isLast: i === PUZZLES.length - 1,
  };
  state.screen = "game";
  window.scrollTo(0, 0);
  render();
}
function startMined(j) {
  const list = mined();
  if (!list[j]) return;
  state.game = {
    mode: "mined",
    index: j,
    pz: list[j],
    info: computeInfo(list[j]),
    chain: [],
    attempts: 0,
    wrong: null,
    err: null,
    result: null,
    label: "Découverte n° " + (j + 1) + " · " + DIFF_LABELS[list[j].diff],
    isLast: j === list.length - 1,
  };
  state.screen = "game";
  window.scrollTo(0, 0);
  render();
}
function exitGame() {
  state.game = null;
  state.screen = "home";
  render();
}
function pushErr(msg, pid) {
  const g = state.game;
  if (!g) return;
  g.err = { msg: msg, pid: pid, key: (g.err ? g.err.key : 0) + 1 };
  if (errTimer) clearTimeout(errTimer);
  errTimer = setTimeout(() => {
    if (state.game) {
      state.game.err = null;
      renderGame();
    }
  }, 3400);
  renderGame();
}
function tryUse(pid) {
  const g = state.game;
  if (!g || g.result) return;
  const p = g.pz.premises.find((x) => x.id === pid);
  if (!p) return;
  const known = new Set(g.chain.map((s) => s.d));
  const usedIds = new Set(g.chain.map((s) => s.pid));
  if (usedIds.has(p.id)) {
    pushErr("Cet énoncé figure déjà dans votre raisonnement.", p.id);
    return;
  }
  if (p.kind === "aff") {
    if (known.has(p.a)) {
      pushErr("« " + litText(p.a, g.pz) + " » est déjà établi.", p.id);
      return;
    }
    g.chain.push({ pid: p.id, d: p.a });
  } else if (p.kind === "imp") {
    if (!known.has(p.a)) {
      pushErr(
        "Prémisse manquante : établissez d'abord « " +
          litText(p.a, g.pz) +
          " » (" +
          litSym(p.a, g.pz) +
          ").",
        p.id
      );
      return;
    }
    if (known.has(p.b)) {
      pushErr("Sa conséquence « " + litText(p.b, g.pz) + " » est déjà établie.", p.id);
      return;
    }
    g.chain.push({ pid: p.id, d: p.b });
  } else {
    if (known.has(p.a) && known.has(p.b)) {
      pushErr("Les deux membres de cette équivalence sont déjà établis.", p.id);
      return;
    }
    if (known.has(p.a)) g.chain.push({ pid: p.id, d: p.b });
    else if (known.has(p.b)) g.chain.push({ pid: p.id, d: p.a });
    else pushErr("Équivalence inutilisable : aucun de ses deux membres n'est établi.", p.id);
  }
  g.wrong = null;
  renderGame();
}
function removeStep(i) {
  const g = state.game;
  if (!g || g.result) return;
  g.chain = g.chain.slice(0, i);
  g.err = null;
  g.wrong = null;
  renderGame();
}
function resetChain() {
  const g = state.game;
  if (!g || g.result) return;
  g.chain = [];
  g.err = null;
  g.wrong = null;
  renderGame();
}
function chooseVerdict(v) {
  const g = state.game;
  if (!g || g.result) return;
  if (v === g.info.verdict) {
    const firstTry = g.attempts === 0;
    const stars = firstTry ? (g.chain.length <= g.info.optimal ? 3 : 2) : 1;
    state.stars[g.pz.id] = Math.max(state.stars[g.pz.id] || 0, stars);
    persistStars(state.stars);
    g.result = { stars: stars, steps: g.chain.length, firstTry: firstTry, attempts: g.attempts };
    render();
  } else {
    g.attempts++;
    g.wrong = { v: v, key: (g.wrong ? g.wrong.key : 0) + 1 };
    renderGame();
  }
}
function replay() {
  const g = state.game;
  if (!g) return;
  g.chain = [];
  g.err = null;
  g.attempts = 0;
  g.wrong = null;
  g.result = null;
  render();
}
function nextLevel() {
  const g = state.game;
  if (!g) return;
  if (g.mode === "level") {
    if (g.index + 1 < PUZZLES.length) startLevel(g.index + 1);
    else exitGame();
  } else {
    if (g.index + 1 < mined().length) startMined(g.index + 1);
    else exitGame();
  }
}
function nextFromResult() {
  const g = state.game;
  if (!g) return;
  if (g.isLast) exitGame();
  else nextLevel();
}

  document.getElementById("app").innerHTML = h;

  h += '<div class="mpanel">';
  h +=
    '<p class="mpintro">Ce moteur interroge <b style="color:#1d4f8b">des sources libres de droits</b> sur le Web (Wikisource : textes du domaine public), en extrait des raisonnements universels — « tout… est… », « nul… n\'est… » — les convertit en enquêtes, les fait passer par le <b style="color:#1d4f8b">même moteur de validation</b> que le reste du site, puis les <b style="color:#1d4f8b">enregistre automatiquement</b>, référence et source à l\'appui. Si le Web reste muet, un <b style="color:#1d4f8b">générateur local</b> compose de nouveaux syllogismes sur des formes classiques. La fouille se déclenche aussi <b style="color:#1d4f8b">toute seule</b> à chaque visite un peu espacée.</p>';
  h += '<div class="mrow">';
  h +=
    '<button class="btn amber"' +
    (state.minerRunning ? " disabled" : "") +
    ' onclick="doMineManual()">' +
    ICON.globe("i16") +
    (state.minerRunning ? " Fouille en cours…" : " Fouiller maintenant") +
    "</button>";
  h +=
    '<span class="dim2 small">' +
    (state.minedStore.lastRun
      ? "Dernière fouille : " + new Date(state.minedStore.lastRun).toLocaleString("fr-FR")

    "</span>";
  if (list.length > 0) {
    h +=
      '<button class="btn txt-danger" onclick="clearMined()">' +
      ICON.rotate("i14") +

  }
  h += "</div>";
  if (state.minerLog.length > 0) {
    h += '<div class="logbox">';
    state.minerLog.forEach((l) => {
      h += '<p class="' + (l.indexOf("  ") === 0 ? "in" : "") + '">' + esc(l) + "</p>";
    });
    h += "</div>";
  }
  h += "</div>";

  h += '<h3 class="mh3 serif">Découvertes enregistrées <span class="dim2">(' + list.length + ")</span></h3>";
  if (list.length === 0) {
    h +=
      '<div class="mempty">' +
      ICON.globe("i24") +
      "<p>Aucune découverte pour l'instant.<br>Lancez la fouille — elle enregistre toute seule.</p></div>";
  } else {
    h += '<div class="grid3" style="margin-top:14px">';
    list.forEach((pz, j) => {
      const s = state.stars[pz.id] || 0;
      h +=
        '<button class="card disc" onclick="startMined(' +
        j +
        ')">' +
        '<div class="card-top"><span class="mono">Découverte n° ' +
        (j + 1) +
        "</span>" +
        (s > 0 ? starsHtml(s) : "") +
        "</div>" +
        '<h3 class="card-title serif">' +
        esc(pz.title) +
        "</h3>" +
        '<p class="card-story">' +
        esc(pz.story) +
        "</p>" +
        '<p class="src-line">' +
        esc(pz.source ? pz.source.family + " · " + pz.source.author : "Générateur local") +
        "</p>" +
        "</button>";
    });
    h += "</div>";
  }
  h += "</div>";
  h +=
    '<div class="footrow"><button class="footbtn" onclick="openCopyright()">© Droits d\'auteurs</button></div>';
  h += "</div>";
  document.getElementById("app").innerHTML = h;
  renderModals();
}

async function doMine() {
  if (state.minerRunning) return;
  state.minerRunning = true;
  if (state.screen === "miner") renderMiner();
  try {
    const res = await runMiner();
    state.minedStore = res.store;
    state.minerLog = res.log;
  } finally {
    state.minerRunning = false;
    render();
  }
}
function doMineManual() {
  doMine();
}
function clearMined() {
  const empty = { items: [], lastRun: state.minedStore.lastRun };
  persistMined(empty);
  state.minedStore = empty;
  render();
}

/* ---- Illustration des solutions : graphes animés ---- */
function replayGraphAnim() {
  const box = document.getElementById("pgbox");
  if (!box) return;
  const c = box.cloneNode(true);
  box.replaceWith(c);
}
function pgTrim(node, ux, uy) {
  /* point d'ancrage sur le bord d'un noeud rectangulaire, selon la direction */
  const hx = node.size.w / 2 + 5;
  const hy = node.size.h / 2 + 5;
  let t = 1e9;
  if (ux !== 0) t = Math.min(t, hx / Math.abs(ux));
  if (uy !== 0) t = Math.min(t, hy / Math.abs(uy));
  return { x: node.x + ux * t, y: node.y + uy * t };
}
function pgArrow(tipx, tipy, dx, dy, color) {
  /* pointe de flèche à (tipx,tipy), orientée selon (dx,dy) */
  const l = Math.hypot(dx, dy) || 1;
  const tx = dx / l, ty = dy / l;
  const nx = -ty, ny = tx;
  const bx = tipx - tx * 9, by = tipy - ty * 9;
  return (
    '<polygon class="pg-head" fill="' +
    color +
    '" points="' +
    tipx.toFixed(1) + "," + tipy.toFixed(1) + " " +
    (bx + nx * 4).toFixed(1) + "," + (by + ny * 4).toFixed(1) + " " +
    (bx - nx * 4).toFixed(1) + "," + (by - ny * 4).toFixed(1) +
    '"/>'
  );
}
function pgBadge(x, y, num) {
  /* pastille circulaire portant le numéro de l'énoncé utilisé */
  return (
    '<g class="pg-fade"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) +
    '" r="9" fill="#eef5fd" stroke="#5b7fb5" stroke-width="1.2"/><text x="' +
    x.toFixed(1) + '" y="' + (y + 3.4).toFixed(1) +
    '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#27548f">' +
    num +
    "</text></g>"
  );
}
function proofGraphHtml(pz, info) {
  /* graphe animé de la chaîne exemplaire : noeuds = faits, arêtes = énoncés */
  const steps = info.canonical || [];
  if (steps.length === 0) {
    return (
      '<div class="pgbox" id="pgbox"><div class="pg-empty">Aucune déduction ne part de ces énoncés : le graphe reste vide.</div></div>'
    );
  }
  const W = 480, H = 200, padX = 44;
  const spanX = W - padX * 2;
  const DELTA = 0.62;
  const pos = {};
  const nodes = [];
  const edges = [];
  steps.forEach((s, i) => {
    const d = s.d;
    const sym = litSym(d, pz);
    const size = { w: 38 + Math.max(0, sym.length - 1) * 9, h: 32 };
    const x = steps.length === 1 ? W / 2 : padX + (i * spanX) / (steps.length - 1);
    const y = i % 2 === 0 ? 80 : 148;
    const t = 0.25 + i * DELTA;
    pos[d] = { x: x, y: y, size: size };
    nodes.push({ lit: d, sym: sym, x: x, y: y, size: size, kind: s.p.kind, t: t });
    if (s.p.kind === "aff") {
      edges.push({ type: "aff", to: pos[d], num: s.p.id.slice(1), t: Math.max(0.05, t - 0.05) });
    } else {
      const from = s.p.kind === "eq" ? (d === s.p.b ? s.p.a : s.p.b) : s.p.a;
      if (from !== d && pos[from]) {
        edges.push({ type: s.p.kind, from: pos[from], to: pos[d], num: s.p.id.slice(1), t: Math.max(0.05, t - 0.4) });
      }
    }
  });
  let h = '<div class="pgbox" id="pgbox">';
  h +=
    '<svg class="play" viewBox="0 0 ' + W + " " + H +
    '" role="img" aria-label="Graphe de la démonstration">';
  edges.forEach((e) => {
    h += '<g class="pg-edge" style="--d:' + e.t.toFixed(2) + 's">';
    if (e.type === "aff") {
      /* épingle dorée : l'énoncé tombe comme un fait posé */
      const up = e.to.y < 120;
      const y1 = up ? e.to.y - e.to.size.h / 2 - 5 : e.to.y + e.to.size.h / 2 + 5;
      const y0 = up ? y1 - 18 : y1 + 18;
      h +=
        '<path pathLength="1" d="M ' + e.to.x + " " + y0 + " L " + e.to.x + " " + y1 +
        '" fill="none" stroke="#ca8a04" stroke-width="1.6"/>';
      h += pgBadge(e.to.x, (y0 + y1) / 2, e.num);
    } else {
      const dx = e.to.x - e.from.x, dy = e.to.y - e.from.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const a = pgTrim(e.from, ux, uy);
      const b = pgTrim(e.to, -ux, -uy);
      let px = -uy, py = ux;
      if (py > 0) { px = -px; py = -py; }
      const bow = Math.min(len * 0.22, 30);
      const cx = (a.x + b.x) / 2 + px * bow;
      const cy = (a.y + b.y) / 2 + py * bow;
      h +=
        '<path pathLength="1" d="M ' + a.x.toFixed(1) + " " + a.y.toFixed(1) +
        " Q " + cx.toFixed(1) + " " + cy.toFixed(1) + " " + b.x.toFixed(1) + " " + b.y.toFixed(1) +
        '" fill="none" stroke="#5b7fb5" stroke-width="2"/>';
      h += pgArrow(b.x, b.y, b.x - cx, b.y - cy, "#5b7fb5");
      if (e.type === "eq") {
        h += pgArrow(a.x, a.y, a.x - cx, a.y - cy, "#5b7fb5");
      }
      const mx = 0.25 * a.x + 0.5 * cx + 0.25 * b.x;
      const my = 0.25 * a.y + 0.5 * cy + 0.25 * b.y;
      h += pgBadge(mx, my, e.num);
    }
    h += "</g>";
  });
  nodes.forEach((n) => {
    const isTarget = atomOf(n.lit) === pz.target;
    const neg = isNeg(n.lit);
    let fill = "#f0f9ff", stroke = "#38a3d8", txt = "#075985";
    if (n.kind === "aff") { fill = "#fffbeb"; stroke = "#ca8a04"; txt = "#92610e"; }
    else if (neg) { fill = "#fff1f2"; stroke = "#e11d48"; txt = "#be2a55"; }
    if (isTarget) stroke = "#d97706";
    const x = n.x - n.size.w / 2, y = n.y - n.size.h / 2;
    const dt = (n.t + (n.kind === "aff" ? 0.18 : 0.32)).toFixed(2);
    h += '<g class="pg-node" style="--d:' + dt + 's">';
    if (isTarget) {
      h +=
        '<rect class="pg-target-ring" x="' + (x - 5).toFixed(1) + '" y="' + (y - 5).toFixed(1) +
        '" width="' + (n.size.w + 10) + '" height="' + (n.size.h + 10) +
        '" rx="19" fill="none" stroke="#d97706" stroke-width="1.6"/>';
    }
    h +=
      '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + n.size.w +
      '" height="' + n.size.h + '" rx="16" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.6"/>';
    h +=
      '<text x="' + n.x.toFixed(1) + '" y="' + (n.y + 4.5).toFixed(1) +
      '" text-anchor="middle" font-size="13" font-weight="700" fill="' + txt + '">' +
      esc(n.sym) + "</text>";
    h += "</g>";
  });
  h += "</svg>";
  h +=
    '<div class="pglegend">' +
    '<span class="pgkey"><i class="pgdot" style="background:#fffbeb;border-color:#ca8a04"></i>affirmation posée</span>' +
    '<span class="pgkey"><i class="pgdot" style="background:#f0f9ff;border-color:#38a3d8"></i>fait déduit</span>' +
    '<span class="pgkey"><i class="pgdot" style="background:#fff1f2;border-color:#e11d48"></i>négation déduite</span>' +
    '<span class="pgkey"><i class="pgdot" style="background:#fffdf5;border-color:#d97706"></i>cible de la question</span>' +
    "<span class=\"pgkey\">pastille = n° de l'énoncé utilisé</span>" +
    "</div>";
  h += "</div>";
  return h;
}
function worldsChartHtml(pz, info) {
  /* barre animée des mondes compatibles : cible vraie vs fausse */
  const t = pz.atoms[pz.target];
  const models = info.models || 0;
  if (models === 0) {
    return (
      '<div class="wchart"><p style="margin:0;font-size:12px;line-height:1.7;color:#7488a3">Aucun monde compatible : les énoncés se contredisent, aucune vérité ne peut être établie.</p></div>'
    );
  }
  const tT = info.tTrue;
  const tF = models - tT;
  const pv = Math.round((tT / models) * 10000) / 100;
  let h = '<div class="wchart play"><div class="wbar">';
  if (tT > 0) {
    h += '<div class="wseg v" style="width:' + pv + '%"><span class="fill" style="--d:.25s"></span></div>';
  }
  if (tF > 0) {
    h +=
      '<div class="wseg f" style="width:' + (100 - pv) + '%"><span class="fill" style="--d:' +
      (tT > 0 ? "0.6s" : "0.25s") +
      '"></span></div>';
  }
  h += "</div>";
  h += '<div class="wlegend">';
  h +=
    '<span><i class="wdot" style="background:#0f9d6e"></i>« ' + esc(t.text) +
    " » vrai : " + tT + " monde" + (tT > 1 ? "s" : "") + "</span>";
  h +=
    '<span><i class="wdot" style="background:#d6405f"></i>faux : ' + tF +
    " monde" + (tF > 1 ? "s" : "") + "</span>";
  h +=
    "<span>" + models + " monde" + (models > 1 ? "s" : "") + " compatible" +
    (models > 1 ? "s" : "") + " au total</span>";
  h += "</div></div>";
  return h;
}
function resultHtml(g) {
  const pz = g.pz;
  const info = g.info;
  const m = VERDICT_META[info.verdict];
  const t = pz.atoms[pz.target].text;
  const semantic =
    info.verdict === "vrai"
      ? "Dans chacun des " +
        info.models +
        " mondes compatibles avec les énoncés, « " +
        t +
        " » est vrai : c'est une nécessité logique."
      : info.verdict === "faux"
        ? "Dans chacun des " +
          info.models +
          " mondes compatibles avec les énoncés, « " +
          t +
          " » est faux : sa négation est une nécessité."
        : "Il existe " +
          info.models +
          " mondes compatibles avec les énoncés : « " +
          t +
          " » y est vrai dans " +
          info.tTrue +
          " et faux dans " +
          (info.models - info.tTrue) +
          ". Rien ne tranche.";
  let h = '<div class="mback"><div class="modal">';
  h +=
    '<div class="msparkle"><span style="color:#b45309">' +
    ICON.sparkle("i16") +
    "</span><span>" +
    (g.result.firstTry
      ? "Verdict prononcé du premier coup"
      : "Verdict prononcé après " + (g.result.attempts + 1) + " tentatives") +
    "</span></div>";
  h +=
    '<p class="mverdict serif">Conclusion : <span class="' +
    info.verdict +
    '">' +
    m.label +
    "</span></p>";
  h += '<p class="msub">' + esc(m.sub) + ".</p>";
  h +=
    '<div class="mstars">' +
    starsHtml(g.result.stars) +
    "<span>Votre chaîne : " +
    g.result.steps +
    " pas · exemplaire : " +
    info.optimal +
    " pas</span></div>";
  h += '<h4 class="mhead">Chaîne exemplaire</h4><ol class="mchain">';
  info.canonical.forEach((s, i) => {
    h +=
      '<li><span class="stepn">' +
      (i + 1) +
      '.</span><div><div class="stepmeta">' +
      kindBadge(s.p.kind) +
      "</div>" +
      '<p class="steptext" style="color:#40536f">' +
      esc(s.p.text) +
      "</p>" +
      '<p class="mstep">' +
      (s.p.kind === "aff" ? "Fait posé" : "Donc") +
      ' : <span class="mono" style="color:#40536f">' +
      esc(litSym(s.d, pz)) +
      "</span> — " +
      esc(litText(s.d, pz)) +
      "</p></div></li>";
  });
  h += "</ol>";
  h +=
    '<div class="mheadrow"><h4 class="mhead">La démonstration en graphe</h4>' +
    '<button class="btn sm" title="Rejouer l\'animation du graphe" onclick="replayGraphAnim()">' +
    ICON.rotate("i14") +
    " Rejouer l\'animation</button></div>";
  h += proofGraphHtml(pz, info);
  h += '<h4 class="mhead">Pourquoi ?</h4><p class="mwhy">' + esc(semantic) + "</p>";
  h += '<h4 class="mhead">Les mondes compatibles</h4>' + worldsChartHtml(pz, info);
  if (pz.moral) {
    h += '<div class="mmoral"><span style="color:#b45309;margin-top:2px">' + ICON.bulb("i16") + "</span><p>" + esc(pz.moral) + "</p></div>";
  }
  h += '<div class="mbtns"><button class="btn" onclick="replay()">' + ICON.rotate("i16") + " Rejouer</button>";
  h +=
    '<button class="btn amber" onclick="nextFromResult()">' +
    (g.isLast ? "Retour au sommaire" : "Niveau suivant") +
    ICON.arrowR("i16") +
    "</button></div>";
  h += "</div></div>";
  return h;
}
function renderModals() {
  let h = "";
  if (state.rulesOpen) h += rulesHtml();
  if (state.copyrightOpen) h += copyrightHtml();
  if (state.game && state.game.result) h += resultHtml(state.game);
  document.getElementById("modals").innerHTML = h;
}

/* ---- Rendu et amorçage ---- */
function render() {
  if (state.screen === "game" && state.game) renderGame();
  else if (state.screen === "miner") renderMiner();
  else renderHome();
}
render();
doMine(); /* fouille automatique au chargement — sans intervention humaine */
