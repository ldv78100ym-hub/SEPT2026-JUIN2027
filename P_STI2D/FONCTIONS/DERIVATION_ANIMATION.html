function loadExercise(key){
  const ex = PY_EXERCISES[key];
  if (!ex) return;
  pyState.editorEl.value = ex.code;
  pyState.msgEl.className = 'py-msg info';
  pyState.msgEl.textContent = ex.hint;
  pyState.trace = [];
  pyState.currentStep = 0;
  updateGutter();
  pyState.traceEl.innerHTML = '<div class="py-trace-empty">Cliquez sur « Exécuter » pour lancer le programme.</div>';
  pyState.varsEl.innerHTML = '<div class="empty">Aucune variable</div>';
  pyState.condEl.className = 'py-cond none';
  pyState.condEl.innerHTML = 'Aucune condition évaluée.';
  document.getElementById('pyStepLabel').textContent = '0 / 0';
}

function runPython(){
  const source = pyState.editorEl.value;
  pyState.msgEl.className = 'py-msg info';
  pyState.msgEl.textContent = 'Analyse du code…';
  try {
    const statements = pyParse(source);
    pyState.trace = pyRun(statements);
    pyState.currentStep = 0;
    renderTraceList();
    if (pyState.trace.length === 0){
      pyState.msgEl.className = 'py-msg err';
      pyState.msgEl.textContent = 'Aucune instruction exécutée.';
      return;
    }
    const hasError = pyState.trace.some(s => s.isError);
    pyState.msgEl.className = hasError ? 'py-msg err' : 'py-msg ok';
    pyState.msgEl.textContent = (hasError ? '⚠ Erreur — ' : '✔ Exécution terminée — ') +
      pyState.trace.length + ' étapes. Utilisez ◀ ▶ pour naviguer.';
    goToStep(0);
  } catch (e){
    pyState.msgEl.className = 'py-msg err';
    pyState.msgEl.textContent = '⚠ ' + e.message;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function renderTraceList(){
  let html = '';
  for (let i = 0; i < pyState.trace.length; i++){
    const s = pyState.trace[i];
    html += '<div class="py-trace-step" data-step="' + i + '">' +
            '<span class="st-num">' + (i + 1) + '</span>' +
            '<span class="st-body">' +
              '<span class="st-line">Ligne ' + s.lineNo + '</span><br>' +
              '<span class="st-desc">' + escapeHtml(s.description) + '</span>' +
            '</span></div>';
  }
  pyState.traceEl.innerHTML = html;
  pyState.traceEl.querySelectorAll('.py-trace-step').forEach(el => {
    el.addEventListener('click', function(){
      goToStep(parseInt(this.dataset.step, 10));
    });
  });
}

function goToStep(idx){
  if (pyState.trace.length === 0) return;
  idx = Math.max(0, Math.min(pyState.trace.length - 1, idx));
  pyState.currentStep = idx;
  const step = pyState.trace[idx];

  document.getElementById('pyStepLabel').textContent = (idx + 1) + ' / ' + pyState.trace.length;

  pyState.traceEl.querySelectorAll('.py-trace-step').forEach((el, i) => {
    el.classList.toggle('current', i === idx);
  });
  const cur = pyState.traceEl.querySelector('.py-trace-step.current');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  highlightGutterLine(step.lineNo);

  const env = step.env;
  const keys = Object.keys(env).sort();
  if (keys.length === 0){
    pyState.varsEl.innerHTML = '<div class="empty">Aucune variable définie</div>';
  } else {
    let html = '';
    keys.forEach(k => {
      html += '<div class="py-var"><span class="v-name">' + escapeHtml(k) +
              '</span><span class="v-val">' + escapeHtml(pySerialize(env[k])) + '</span></div>';
    });
    pyState.varsEl.innerHTML = html;
  }

  if (step.condition){
    const ok = step.condition.result;
    pyState.condEl.className = 'py-cond ' + (ok ? 'true' : 'false');
    pyState.condEl.innerHTML =
      '<span class="c-text">' + escapeHtml(step.condition.text) + '</span>' +
      '<span class="c-badge">' + (ok ? 'VRAI' : 'FAUX') + '</span>';
  } else if (step.isError){
    pyState.condEl.className = 'py-cond false';
    pyState.condEl.innerHTML = '<span class="c-text">Erreur d\'exécution</span>';
  } else {
    pyState.condEl.className = 'py-cond none';
    pyState.condEl.innerHTML = 'Aucune condition évaluée à cette étape.';
  }
}

/* ============================================================
   INITIALISATION
   ============================================================ */
window.addEventListener('resize', resize);
resize();
state.points = buildPoints(state.dt);
state.playing = true;
state.animT = 0;
state.revealed = 0;
updateHints();
renderPanel();
requestAnimationFrame(tick);

})();
</script>
