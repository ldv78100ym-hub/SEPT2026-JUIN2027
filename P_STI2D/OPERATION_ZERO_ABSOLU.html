<script>
/* ==================== OUTILS ==================== */
var R = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
var pick = function (a) { return a[R(0, a.length - 1)]; };
var fr = function (n) { var s = (Math.round(n * 100) / 100).toString(); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ","); };
var NEG = "\u2212", UP = "\u2197", DOWN = "\u2198", FLAT = "\u2192", PI = "\u03c0", SQ = "\u221a";
var DOC = document;
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

/* ==================== CONSTRUCTEURS ==================== */
function MC(prompt, correct, wrongs, hint, ex, extra) {
  var uniq = [];
  wrongs.forEach(function (w) { if (w !== correct && uniq.indexOf(w) < 0) uniq.push(w); });
  var arr = [correct].concat(uniq);
  for (var i = arr.length - 1; i > 0; i--) { var j = R(0, i); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  var q = { kind: "mcq", prompt: prompt, choices: arr, correct: arr.indexOf(correct), hint: hint, ex: ex };
  if (extra) Object.assign(q, extra);
  return q;
}
function mkN(prompt, ans, tol, hint, ex, extra) {
  var q = { kind: "num", prompt: prompt, ans: ans, tol: tol, hint: hint, ex: ex };
  if (extra) Object.assign(q, extra);
  return q;
}
function mkSign(prompt, xs, label, target, hint, ex) {
  return { kind: "sign", prompt: prompt, sign: { xs: xs, label: label, target: target }, hint: hint, ex: ex };
}
function mkVar(prompt, xs, fvals, target, hint, ex, signShow) {
  var q = { kind: "var", prompt: prompt, vart: { xs: xs, fvals: fvals, target: target }, hint: hint, ex: ex };
  if (signShow) q.signShow = signShow;
  return q;
}

/* ==================== GRAPHIQUE SVG ==================== */
function graphSVG(spec) {
  var W = 400, H = 290, pad = 30;
  var ymin = spec.ymin, ymax = spec.ymax;
  if (ymin === undefined || ymax === undefined) {
    var mn = Infinity, mx = -Infinity;
    (spec.curves || []).forEach(function (c) { for (var i = 0; i <= 200; i++) { var x = spec.xmin + ((spec.xmax - spec.xmin) * i) / 200; var y = c.fn(x); if (isFinite(y)) { if (y < mn) mn = y; if (y > mx) mx = y; } } });
    (spec.points || []).forEach(function (p) { if (p.y < mn) mn = p.y; if (p.y > mx) mx = p.y; });
    if (!isFinite(mn)) { mn = -5; mx = 5; }
    if (mx - mn < 1) { mx += 1; mn -= 1; }
    var sp = (mx - mn) * 0.15; mn -= sp; mx += sp;
    if (ymin === undefined) ymin = mn;
    if (ymax === undefined) ymax = mx;
  }
  var X = function (x) { return pad + ((x - spec.xmin) / (spec.xmax - spec.xmin)) * (W - 2 * pad); };
  var Y = function (y) { return H - pad - ((y - ymin) / (ymax - ymin)) * (H - 2 * pad); };
  var cl = function (y) { return Math.min(ymax, Math.max(ymin, y)); };
  var gstep = spec.grid || Math.max(1, Math.round((spec.xmax - spec.xmin) / 10));
  var gridXs = [], gridYs = [], gx, gy;
  for (gx = Math.ceil(spec.xmin / gstep) * gstep; gx <= spec.xmax + 0.001; gx += gstep) gridXs.push(gx);
  for (gy = Math.ceil(ymin / gstep) * gstep; gy <= ymax + 0.001; gy += gstep) gridYs.push(gy);
  var ox = spec.xmin <= 0 && spec.xmax >= 0 ? X(0) : pad;
  var oy = ymin <= 0 && ymax >= 0 ? Y(0) : H - pad;
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" class="graph" role="img">';
  gridXs.forEach(function (g) { s += '<line x1="' + X(g).toFixed(1) + '" y1="' + (pad - 12) + '" x2="' + X(g).toFixed(1) + '" y2="' + (H - pad + 12) + '" stroke="#e2e8f0" stroke-width="1"/>'; });
  gridYs.forEach(function (g) { s += '<line x1="' + (pad - 12) + '" y1="' + Y(g).toFixed(1) + '" x2="' + (W - pad + 12) + '" y2="' + Y(g).toFixed(1) + '" stroke="#e2e8f0" stroke-width="1"/>'; });
  s += '<line x1="' + (pad - 12) + '" y1="' + oy.toFixed(1) + '" x2="' + (W - pad + 12) + '" y2="' + oy.toFixed(1) + '" stroke="#64748b" stroke-width="1.5"/>';
  s += '<line x1="' + ox.toFixed(1) + '" y1="' + (pad - 12) + '" x2="' + ox.toFixed(1) + '" y2="' + (H - pad + 12) + '" stroke="#64748b" stroke-width="1.5"/>';
  gridXs.forEach(function (g) { if (Math.abs(g) >= 0.001) s += '<text x="' + (X(g) + 1).toFixed(1) + '" y="' + (oy + 11).toFixed(1) + '" font-size="9" fill="#64748b">' + esc(fr(g)) + "</text>"; });
  gridYs.forEach(function (g) { if (Math.abs(g) >= 0.001) s += '<text x="' + (ox + 4).toFixed(1) + '" y="' + (Y(g) + 3).toFixed(1) + '" font-size="9" fill="#64748b">' + esc(fr(g)) + "</text>"; });
  (spec.curves || []).forEach(function (c) {
    var d = "";
    for (var i = 0; i <= 200; i++) { var x = spec.xmin + ((spec.xmax - spec.xmin) * i) / 200; d += (i === 0 ? "M" : "L") + X(x).toFixed(1) + "," + Y(cl(c.fn(x))).toFixed(1) + " "; }
    s += '<path d="' + d + '" fill="none" stroke="' + c.color + '" stroke-width="2.5"/>';
  });
  if (spec.tangent) {
    var t = spec.tangent, dx = (spec.xmax - spec.xmin) / 7, x1 = t.x - dx, x2 = t.x + dx;
    s += '<path d="M' + X(x1).toFixed(1) + "," + Y(cl(t.slope * (x1 - t.x) + t.y)).toFixed(1) + " L" + X(x2).toFixed(1) + "," + Y(cl(t.slope * (x2 - t.x) + t.y)).toFixed(1) + '" fill="none" stroke="' + (t.color || "#d97706") + '" stroke-width="2" stroke-dasharray="6 4"/>';
  }
  (spec.points || []).forEach(function (p) {
    s += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="4.5" fill="' + (p.color || "#d97706") + '" stroke="#ffffff" stroke-width="1.5"/>';
    if (p.label) s += '<text x="' + (X(p.x) + 7).toFixed(1) + '" y="' + (Y(p.y) - 7).toFixed(1) + '" font-size="11" font-weight="bold" fill="#b45309">' + esc(p.label) + "</text>";
  });
  s += '<text x="' + (W - pad + 4) + '" y="' + (oy - 5).toFixed(1) + '" font-size="11" fill="#64748b">x</text>';
  s += '<text x="' + (ox + 5).toFixed(1) + '" y="' + (pad - 14) + '" font-size="11" fill="#64748b">y</text>';
  s += '<text x="' + (ox - 4).toFixed(1) + '" y="' + (oy + 11).toFixed(1) + '" font-size="11" fill="#64748b">O</text>';
  s += "</svg>";
  return s;
}

/* ==================== TABLEAUX ==================== */
function signTableHTML(xs, label, signs, interactive) {
  var n = xs.length, cols = 2 * n - 1;
  var z = xs.map(function (_, i) { return i > 0 && i < n - 1; });
  var rowX = "", rowS = "";
  for (var k = 0; k < cols; k++) {
    if (k % 2 === 0) {
      var i0 = k / 2;
      rowX += "<td class='xcell'>" + esc(xs[i0]) + "</td>";
      rowS += "<td class='zcell'>" + (z[i0] ? "0" : "") + "</td>";
    } else {
      var i1 = (k - 1) / 2;
      rowX += "<td class='xempty'></td>";
      if (interactive) rowS += "<td class='scell int' id='sc" + i1 + "' onclick='cycleSign(" + i1 + ")'>" + esc(signs[i1]) + "</td>";
      else rowS += "<td class='scell'>" + esc(signs[i1]) + "</td>";
    }
  }
  return "<table class='sign'><tbody><tr><td class='hdr'>x</td>" + rowX + "</tr><tr><td class='hdr'>" + esc(label) + "</td>" + rowS + "</tr></tbody></table>";
}
function varTableHTML(xs, fvals, arrows, interactive) {
  var n = xs.length, cols = 2 * n - 1;
  var rowX = "", rowF = "";
  for (var k = 0; k < cols; k++) {
    if (k % 2 === 0) {
      var i0 = k / 2;
      rowX += "<td class='xcell'>" + esc(xs[i0]) + "</td>";
      rowF += "<td class='zcell fval'>" + (fvals[i0] == null ? "" : esc(String(fvals[i0]))) + "</td>";
    } else {
      var i1 = (k - 1) / 2;
      rowX += "<td class='xempty'></td>";
      if (interactive) rowF += "<td class='scell int arr' id='ac" + i1 + "' onclick='cycleArr(" + i1 + ")'>" + esc(arrows[i1]) + "</td>";
      else rowF += "<td class='scell arr'>" + esc(arrows[i1]) + "</td>";
    }
  }
  return "<table class='sign'><tbody><tr><td class='hdr'>x</td>" + rowX + "</tr><tr><td class='hdr'>f(x)</td>" + rowF + "</tr></tbody></table>";
}

/* ==================== GÉNÉRATEURS (87) ==================== */
/* Aides à la génération : valeurs dynamiques en [−100 ; 100] (sauf domaines de validité) */
var NZ = function (a, b) { var v = R(a, b); while (v === 0) v = R(a, b); return v; };
var M = function (n) { return String(n).replace(/-/g, NEG); };
var gcdF = function (a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; };
var fracS = function (n, d) { if (d < 0) { n = -n; d = -d; } var g = gcdF(n, d); n = n / g; d = d / g; if (d === 1) return String(n); return M(n) + "/" + d; };
var SUPD = { "0": "\u2070", "1": "\u00b9", "2": "\u00b2", "3": "\u00b3", "4": "\u2074", "5": "\u2075", "6": "\u2076", "7": "\u2077", "8": "\u2078", "9": "\u2079", "-": "\u207b" };
var sup = function (n) { var s = String(n).split(""); return s.map(function (c) { return SUPD[c] || c; }).join(""); };
var term = function (c, p) { var a = Math.abs(c); var s = (a === 1 && p > 0) ? "" : String(a); if (p === 1) s += "x"; else if (p === 2) s += "x\u00b2"; else if (p === 3) s += "x\u00b3"; else if (p === 4) s += "x\u2074"; return s; };
var polyS = function (cs) { var deg = cs.length - 1, out = "", first = true; for (var i = 0; i <= deg; i++) { var c = cs[i], p = deg - i; if (c === 0) continue; var sign = first ? (c < 0 ? NEG + " " : "") : (c < 0 ? NEG + " " : "+ "); out += sign + term(c, p); first = false; } return out === "" ? "0" : out; };
var binF = function (a, c) { var s = (a === 1 ? "" : String(a)) + "x"; if (c !== 0) s += c > 0 ? " + " + c : " " + NEG + " " + (0 - c); return "(" + s + ")"; };
var pts = function (x, y) { return "(" + M(x) + " ; " + M(y) + ")"; };

var TAGS = ["Primaire", "Collège", "Seconde", "Première STI2D"];
var S = { screen: "menu", stats: {}, chap: 0, unlocked: 1, sceneIdx: 0, chapErr: 0, qi: 0, q: null, sel: null, inp: "", signs: [], arrows: [], st: "ask", adaptMsg: "", trainTag: null, trainGid: null, questMode: "chapter" };
function curD(gid) { return S.stats[gid] ? S.stats[gid].d : 2; }
function totalOk() { return Object.keys(S.stats).reduce(function (a, k) { return a + S.stats[k].ok; }, 0); }
function totalAtt() { return Object.keys(S.stats).reduce(function (a, k) { return a + S.stats[k].att; }, 0); }

function record(gid, ok, inChapter) {
  var s = S.stats[gid] || { d: 2, streak: 0, ok: 0, att: 0 };
  var ns = { d: s.d, streak: ok ? s.streak + 1 : 0, ok: s.ok + (ok ? 1 : 0), att: s.att + 1 };
  var msg = "";
  if (ok && ns.streak >= 2 && ns.d < 3) { ns.d += 1; ns.streak = 0; msg = "📈 Série de réussites : le niveau des prochains exercices monte !"; }
  else if (!ok && ns.d > 1) { ns.d -= 1; msg = "🎯 Niveau adapté : on consolide avec un exercice plus accessible."; }
  S.stats[gid] = ns;
  S.adaptMsg = msg;
  if (inChapter && !ok) S.chapErr += 1;
}
function setQuestion(q) {
  S.q = q; S.sel = null; S.inp = ""; S.st = "ask";
  S.signs = q.sign ? q.sign.target.map(function () { return "?"; }) : [];
  S.arrows = q.vart ? q.vart.target.map(function () { return "?"; }) : [];
}
function startQuest(chIdx, qi0) {
  var gid = CHAP[chIdx].quests[qi0].gen;
  S.chap = chIdx; S.qi = qi0; S.questMode = "chapter";
  setQuestion(buildQ(gid, curD(gid)));
  S.adaptMsg = "";
  S.screen = "quest";
  render();
}
function retry() {
  var gid = S.questMode === "train" ? S.trainGid : CHAP[S.chap].quests[S.qi].gen;
  setQuestion(buildQ(gid, curD(gid)));
  render();
}
function advance() {
  if (S.questMode === "train") { newTrainQ(S.trainTag); render(); return; }
  var c = CHAP[S.chap];
  var nqi = S.qi + 1;
  if (nqi >= c.quests.length) { S.screen = "twist"; render(); return; }
  var gid = c.quests[nqi].gen;
  S.qi = nqi;
  setQuestion(buildQ(gid, curD(gid)));
  S.adaptMsg = "";
  render();
}
function nextChapter() {
  if (S.chap >= CHAP.length - 1) { S.screen = "end"; render(); return; }
  var nc = S.chap + 1;
  S.chap = nc;
  S.unlocked = Math.max(S.unlocked, nc + 1);
  S.sceneIdx = 0; S.chapErr = 0;
  S.screen = "intro";
  render();
}
function enterChapter(i) { S.chap = i; S.sceneIdx = 0; S.chapErr = 0; S.screen = "intro"; render(); }
function storyNext() { var c = CHAP[S.chap]; if (S.sceneIdx >= c.intro.length - 1) startQuest(S.chap, 0); else { S.sceneIdx += 1; render(); } }
function newTrainQ(tag) {
  var ids = Object.keys(G).filter(function (k) { return G[k].tag === tag; });

}
function startTraining(tag) { S.trainTag = tag; S.questMode = "train"; S.screen = "train"; newTrainQ(tag); render(); }

/* ==================== INTERACTIONS QUESTION ==================== */
function canSubmit() {
  var q = S.q;
  if (!q) return false;
  if (q.kind === "mcq") return S.sel !== null;
  if (q.kind === "num") return S.inp.trim().length > 0;
  if (q.kind === "sign") return S.signs.every(function (s) { return s !== "?"; });
  return S.arrows.every(function (a) { return a !== "?"; });
}
function check() {
  var q = S.q;
  if (q.kind === "mcq") return S.sel === q.correct;
  if (q.kind === "num") { var v = parseFloat(S.inp.replace(",", ".").replace(/ /g, "")); return isFinite(v) && Math.abs(v - q.ans) <= q.tol; }
  if (q.kind === "sign") return S.signs.every(function (s, i) { return s === q.sign.target[i]; });
  return S.arrows.every(function (a, i) { return a === q.vart.target[i]; });
}
function validate() {
  if (S.st !== "ask" || !canSubmit()) return;
  var ok = check();
  record(S.q.gid, ok, S.questMode === "chapter");
  S.st = ok ? "right" : "wrong1";
  refreshQuest();
  refreshAdapt();
}
function showSolution() { if (S.st === "wrong1") { S.st = "wrong2"; refreshQuest(); } }
function selChoice(i) { if (S.st !== "ask") return; S.sel = i; refreshQuest(); }

function numKey(e) { if (e && e.key === "Enter" && canSubmit() && S.st === "ask") validate(); }
function cycleSign(i) {

  S.signs[i] = cs[(k + 1) % cs.length];
  var el = DOC.getElementById("sc" + i);
  if (el) el.textContent = S.signs[i];
  updateValider();
}
function cycleArr(i) {
  if (S.st !== "ask") return;
  var ca = ["?", UP, DOWN, FLAT];
  var k = ca.indexOf(S.arrows[i]);
  S.arrows[i] = ca[(k + 1) % ca.length];
  var el = DOC.getElementById("ac" + i);
  if (el) el.textContent = S.arrows[i];
  updateValider();
}
function updateValider() { var el = DOC.getElementById("valider"); if (el) el.disabled = !canSubmit(); }
function refreshQuest() { var el = DOC.getElementById("questbody"); if (el) el.innerHTML = questBodyHTML(S.q); }
function refreshAdapt() { var el = DOC.getElementById("adaptdiv"); if (el) el.innerHTML = adaptHTML(); }
function adaptHTML() { return S.adaptMsg ? "<div class='adaptmsg'>" + esc(S.adaptMsg) + "</div>" : ""; }

function feedbackHTML() {
  var q = S.q;
  if (S.st === "right") return "<div class='fb fb-right'><div class='fbtitle'>✅ Excellent, Agent !</div><div>" + esc(q.ex) + "</div><div class='mt'><button type='button' class='btn btn-primary' onclick='advance()'>Continuer l'aventure ➜</button></div></div>";
  if (S.st === "wrong1") return "<div class='fb fb-wrong1'><div class='fbtitle'>❌ Pas tout à fait...</div><div>💡 Indice : " + esc(q.hint) + "</div><div class='mut sm'>Le moteur adapte le niveau : une variante plus accessible vous attend.</div><div class='mt'><button type='button' class='btn btn-outline' onclick='retry()'>🔄 Réessayer (exercice adapté)</button> <button type='button' class='btn btn-outline' onclick='showSolution()'>💡 Voir la solution</button></div></div>";
  if (S.st === "wrong2") return "<div class='fb fb-wrong2'><div class='fbtitle'>💡 Solution et méthode</div><div>" + esc(q.ex) + "</div><div class='mt'><button type='button' class='btn btn-danger' onclick='advance()'>Continuer quand même ➜</button></div></div>";
  return "";
}
function questBodyHTML(q) {
  var h = "<div class='qcard'>";
  h += "<div class='qmeta'>" + esc(q.label) + " · " + esc(q.tag) + "</div>";

    var h0 = "<div class='trainwrap center'>";
    h0 += "<h2>🏋️ Salle d'entraînement</h2>";
    h0 += "<p class='mut sm'>Entraînement libre par niveau : la difficulté s'adapte à vos réussites, sans récit.</p>";
    h0 += "<div class='btnrow'>";
    TAGS.forEach(function (t) { h0 += "<button type='button' class='btn btn-primary' onclick='startTraining(\"" + t + "\")'>" + t + "</button>"; });
    h0 += "</div>";
    h0 += "<div class='mt'><button type='button' class='btn' onclick='goMenu()'>Menu</button></div></div>";
    return h0;
  }
  var h = "<div class='questwrap'>";
  h += "<div class='qhead'><div class='qtitle'>Entraînement — " + S.trainTag + "</div><button type='button' class='btn' onclick='quitTraining()'>Changer de niveau</button></div>";
  h += "<div id='questbody'>" + questBodyHTML(S.q) + "</div>";
  h += "<div id='adaptdiv'>" + adaptHTML() + "</div>";
  h += "</div>";
  return h;
}
function progHTML() {
  var h = "<div class='progwrap'><h2>📚 Programme couvert & progression</h2>";
  TAGS.forEach(function (t) {
    h += "<h3 class='tagtitle'>" + t + "</h3><div class='skills'>";
    Object.keys(G).filter(function (k) { return G[k].tag === t; }).forEach(function (k) {
      var s = S.stats[k];
      var pct = s && s.att > 0 ? Math.round((100 * s.ok) / s.att) : 0;
      h += "<div class='skill'><div class='skillname'>" + esc(G[k].label) + "</div><div class='skillrow'><span class='mini'><span class='minifill' style='width:" + pct + "%'></span></span><span class='mut sm'>" + (s ? s.ok + "/" + s.att + " · niv " + s.d + "/3" : "non travaillé") + "</span></div></div>";
    });
    h += "</div>";
  });
  h += "<div class='mt'><button type='button' class='btn' onclick='goMenu()'>Menu</button></div></div>";
  return h;
}
function render() {
  var h = "<header><div class='hwrap'><button type='button' class='logo' onclick='goMenu()'><b>Opération</b> Zéro Absolu</button><div class='hbtns'><span class='chip'>Réussites : <b class='okc'>" + totalOk() + "</b> / " + totalAtt() + "</span>" + (S.screen !== "menu" ? "<button type='button' class='btn btn-outline' onclick='goMap()'>Carte</button>" : "") + "</div></div></header>";
  h += "<main class='wrap'>";
  if (S.screen === "menu") h += menuHTML();
  else if (S.screen === "map") h += mapHTML();
  else if (S.screen === "intro") h += introHTML();
  else if (S.screen === "quest") h += questHTML();
  else if (S.screen === "twist") h += twistHTML();
  else if (S.screen === "end") h += endHTML();
  else if (S.screen === "train") h += trainHTML();
  else if (S.screen === "prog") h += progHTML();
  h += "</main>";
  DOC.getElementById("app").innerHTML = h;
}

render();
</script>
</body>
</html>
